name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze & test (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  rules:
    name: Firestore security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase-rules-tests/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        working-directory: firebase-rules-tests
        run: npm ci
      - name: Run rules tests against the emulator
        working-directory: firebase-rules-tests
        run: npx firebase emulators:exec --only firestore --project demo-docrs "node --test --test-concurrency=1 firestore.rules.test.mjs app-payloads.test.mjs indexes.test.mjs" --config ../firebase.json

  web:
    name: Build web
    runs-on: ubuntu-latest
    needs: [flutter, rules]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        run: >
          flutter build web --release
          --dart-define=DOCRS_RECAPTCHA_SITE_KEY=${{ vars.DOCRS_RECAPTCHA_SITE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 7

  # Deploys the web app to Firebase Hosting from main only, after every check
  # passed. It needs the FIREBASE_SERVICE_ACCOUNT secret (see docs/FIREBASE_SETUP.md).
  # Until that secret exists the deploy is skipped (with a notice) instead of failing.
  # Security rules are NOT deployed from CI: publish them by hand so a rules
  # change is always a deliberate step.
  deploy-web:
    name: Deploy web (Firebase Hosting)
    runs-on: ubuntu-latest
    needs: [web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Check deploy credentials
        id: creds
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Add the FIREBASE_SERVICE_ACCOUNT secret to deploy (docs/FIREBASE_SETUP.md, section 9)."
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.enabled == 'true'
      - uses: actions/download-artifact@v4
        if: steps.creds.outputs.enabled == 'true'
        with:
          name: web-build
          path: build/web
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: steps.creds.outputs.enabled == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: docrs-clinical-system
          channelId: live
